<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لقيا · الخريطة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="laqya.css">
<style>
  /* The Expo map, as the team's Figma draws it: a white 3D city, the pavilions as labels, the chosen one in a card below.
     Only the Kingdom pavilion opens (the 3D tour with Saad); the rest show what the app will hold. */
  body { background: #EEEEEC; }
  .stage { position: fixed; inset: 0; background: #EEEEEC; overflow: hidden; }
  .city { position: absolute; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
    width: min(100vw, 560px); aspect-ratio: 1104 / 1164; background: url(img/map.jpg) center / cover; }
  .city::before { content: ""; position: absolute; inset: -40px 0 auto; height: 60px; background: linear-gradient(#EEEEEC, transparent); }

  .search { position: fixed; z-index: 5; top: calc(14px + env(safe-area-inset-top, 0px)); inset-inline: 12px; max-width: 536px; margin: 0 auto;
    display: flex; gap: .55rem; }
  .search label { flex: 1; display: flex; align-items: center; gap: .5rem; background: #fff; border-radius: 999px; padding: 0 1rem;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .06); }
  .search input { flex: 1; border: 0; background: none; font: inherit; font-size: .92rem; padding: .7rem 0; min-width: 0; color: var(--ink); }
  .search input:focus { outline: none; }
  .search label:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
  .search svg { width: 20px; height: 20px; flex: none; color: var(--soft); }
  .search .round { width: 46px; height: 46px; border: 0; box-shadow: 0 4px 16px rgba(0, 0, 0, .06); }

  /* a pavilion label: white card, status dot, a stem down to its building */
  .pav { position: absolute; transform: translate(-50%, 0); display: flex; align-items: center; gap: .5rem; background: #fff; border: 0;
    border-radius: 18px; padding: .45rem .7rem; box-shadow: 0 6px 18px rgba(0, 0, 0, .08); cursor: pointer; font: inherit; color: var(--ink);
    text-align: start; white-space: nowrap; }
  .pav b { display: block; font-size: clamp(.8rem, 3.4vw, .95rem); font-weight: 700; line-height: 1.3; }
  .pav small { display: block; font-size: clamp(.66rem, 2.7vw, .74rem); color: var(--soft); line-height: 1.3; }
  .pav .st { width: 20px; height: 20px; border-radius: 50%; background: #C9C8C3; flex: none; }
  .pav[aria-pressed="true"] { outline: 2px solid var(--olive); }
  .pav.start { background: var(--olive); color: #fff; border-radius: 999px; padding: .35rem .55rem .35rem 1rem; }
  .pav.start .st { background: #fff; display: grid; place-items: center; width: 26px; height: 26px; }
  .pav.start .st svg { width: 15px; height: 15px; color: var(--olive); }
  .pav.start b { font-size: clamp(.8rem, 3.4vw, .92rem); font-weight: 600; }
  .pav.start[aria-pressed="true"] { outline-color: #fff; box-shadow: 0 0 0 4px rgba(75, 85, 60, .35); }
  .pav.done .st { background: var(--olive); }
  .pav.doing .st { background: #B8C79A; }

  .sheet { position: fixed; z-index: 6; inset-inline: 12px; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); max-width: 536px; margin: 0 auto; display: grid; gap: .6rem; }
  .legend { justify-self: center; display: flex; gap: .9rem; align-items: center; background: #fff; border-radius: 999px; padding: .35rem .9rem;
    font-size: .76rem; box-shadow: 0 4px 14px rgba(0, 0, 0, .06); }
  .legend span { display: inline-flex; align-items: center; gap: .3rem; }
  .legend i { width: 13px; height: 13px; border-radius: 4px; display: inline-block; }
  .card.info { border-radius: 26px; padding: 1rem; display: grid; gap: .8rem; box-shadow: 0 12px 30px rgba(0, 0, 0, .08); }
  .info-top { display: flex; gap: .8rem; align-items: center; }
  .info-top .ph { width: 64px; height: 64px; border-radius: 16px; background: center / cover; flex: none; }
  .info-top .ph.soon { background: var(--peach); display: grid; place-items: center; color: var(--terra); font-weight: 700; font-size: 1.5rem; }
  .info-top div { flex: 1; min-width: 0; }
  .info-top h2 { font-size: 1.3rem; font-weight: 700; line-height: 1.4; }
  .info-top p { margin: 0; color: var(--soft); font-size: .84rem; line-height: 1.6; }
  .count { background: #E5E9DC; color: var(--olive); font-size: .74rem; font-weight: 600; border-radius: 999px; padding: .2rem .65rem; white-space: nowrap; align-self: start; }
  .info .btn { padding: .85rem; }
</style>
</head>
<body>
<div class="stage">
  <div class="city" id="city"></div>
</div>

<div class="search">
  <label><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <input type="search" id="q" placeholder="ابحث عن دولة أو جناح..." aria-label="ابحث عن دولة أو جناح"></label>
  <button class="round" type="button" aria-label="طبقات الخريطة">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l8 4-8 4-8-4zM4 12l8 4 8-4M4 16l8 4 8-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg></button>
</div>

<div class="sheet">
  <div class="legend" aria-hidden="true">
    <span><i style="background:var(--olive)"></i>مكتمل + طابع</span>
    <span><i style="background:#B8C79A"></i>قيد الاستكشاف</span>
    <span><i style="background:#C9C8C3"></i>لم تزره</span>
  </div>
  <article class="card info" id="info" aria-live="polite"></article>
</div>

<nav class="tabbar" data-current="map"></nav>
<script type="module" src="laqya-nav.js"></script>
<script>
  // label positions are where the Figma draws them on this city image (percent of the image)
  const PAVILIONS = [
    { id: 'ksa', name: 'جناح المملكة', open: true, x: 51, y: 36, start: true,
      about: 'أول جناح في جولتك · ٩ محطات مع سعد' },
    { id: 'heritage', name: 'جناح التراث', x: 25, y: 4 },
    { id: 'oasis', name: 'جناح الواحة', x: 82, y: 4 },
    { id: 'future', name: 'جناح المستقبل', x: 20, y: 54 },
  ];
  const $ = (id) => document.getElementById(id);
  const ar = (n) => n.toLocaleString('ar-SA');
  let picked = 'ksa';

  // the Kingdom pavilion's status comes from the tour (tour.js keeps how far the visitor got)
  function ksaState() {
    try {
      const s = JSON.parse(localStorage.getItem('laqya-stop') || 'null');
      if (!s) return '';
      return Math.max(s.max || 0, s.n || 0) >= s.of ? 'done' : 'doing';
    } catch { return ''; }
  }

  function draw() {
    const q = $('q').value.trim();
    const city = $('city');
    city.replaceChildren();
    for (const p of PAVILIONS) {
      if (q && !p.name.includes(q)) continue;
      const b = document.createElement('button');
      b.type = 'button';
      const state = p.open ? ksaState() : '';
      b.className = 'pav' + (p.start ? ' start' : '') + (state ? ' ' + state : '');
      b.style.left = p.x + '%'; b.style.top = p.y + '%';
      b.setAttribute('aria-pressed', String(p.id === picked));
      b.innerHTML = p.start
        ? `<span class="st"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0113 0c0 5.4-6.5 11-6.5 11z" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="10" r="2.4" fill="currentColor"/></svg></span><b>ابدأ من هنا · ${p.name}</b>`
        : `<span class="st"></span><span><b>${p.name}</b><small>${state === 'done' ? 'مكتمل' : 'لم تزره بعد'}</small></span>`;
      b.addEventListener('click', () => { picked = p.id; draw(); });
      city.appendChild(b);
    }
    const i = PAVILIONS.findIndex((p) => p.id === picked);
    const p = PAVILIONS[i];
    $('info').innerHTML = p.open
      ? `<div class="info-top"><span class="ph" style="background-image:url(img/dome.jpg)"></span>
           <div><h2>${p.name}</h2><p>${p.about}</p></div><span class="count">الجناح ${ar(i + 1)} من ${ar(PAVILIONS.length)}</span></div>
         <a class="btn primary block" href="tour.html">تجوّل داخل الجناح
           <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a>`
      : `<div class="info-top"><span class="ph soon" aria-hidden="true">${p.name.replace(/^جناح (ال)?/, '')[0]}</span>
           <div><h2>${p.name}</h2><p>نجهّز جولته ثلاثية الأبعاد. لين يفتح، ابدأ من جناح المملكة.</p></div><span class="count">قريباً</span></div>
         <button class="btn block" type="button" id="toKsa">روح لجناح المملكة</button>`;
    $('toKsa')?.addEventListener('click', () => { picked = 'ksa'; $('q').value = ''; draw(); });
  }
  $('q').addEventListener('input', () => {
    const hit = PAVILIONS.find((p) => p.name.includes($('q').value.trim()));
    if (hit) picked = hit.id;
    draw();
  });
  draw();
</script>
</body>
</html>
