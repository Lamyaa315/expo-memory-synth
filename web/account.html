<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لقيا · الحساب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="laqya.css">
<style>
  /* The account is a mockup: nothing leaves this browser, and no password is ever kept */
  .demo { margin: 0; font-size: .8rem; color: var(--soft); background: #EFEDE7; border-radius: 12px; padding: .45rem .7rem; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border-radius: 999px; padding: 4px; }
  .tabs button { font: 600 .9rem var(--font); border: 0; border-radius: 999px; padding: .5rem; background: none; color: var(--soft); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .08); }
  form { display: grid; gap: .7rem; }
  label.f { display: grid; gap: .25rem; font-size: .86rem; font-weight: 500; }
  input[type="text"], input[type="email"], input[type="password"], select {
    font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: .65rem .8rem; width: 100%; }
  input:focus, select:focus { outline: 3px solid var(--focus); outline-offset: 1px; }
  .or { text-align: center; color: var(--soft); font-size: .82rem; margin: 0; }
  .link { background: none; border: 0; color: var(--olive); font: 600 .9rem var(--font); cursor: pointer; padding: .3rem; }

  .profile { display: flex; align-items: center; gap: .9rem; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; flex: none;
    background: var(--lilac); color: var(--plum); font-size: 1.6rem; font-weight: 700; }
  .profile b { display: block; font-size: 1.2rem; }
  .profile small { color: var(--soft); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; text-align: center; }
  .stats div { background: var(--bg); border-radius: 16px; padding: .6rem .3rem; }
  .stats b { display: block; font-size: 1.3rem; color: var(--olive); }
  .stats span { font-size: .78rem; color: var(--soft); }

  /* "طوابعي" (Figma): postage stamps, the ones not stamped yet greyed with a lock */
  .stamps-head { display: flex; align-items: center; justify-content: space-between; gap: .6rem; }
  .stamps-head h2 { display: flex; align-items: center; gap: .35rem; }
  .stamps-head h2 svg { width: 20px; height: 20px; color: var(--terra); }
  .count-pill { background: var(--peach); color: var(--terra); font-weight: 700; font-size: .8rem; border-radius: 999px; padding: .15rem .6rem; }
  .meter { height: 7px; border-radius: 99px; background: #E9E6DE; overflow: hidden; margin: .5rem 0 .2rem; }
  .meter i { display: block; height: 100%; background: #C9A24A; border-radius: inherit; transition: width .6s ease; }
  .stamps { display: grid; grid-template-columns: repeat(3, 1fr); gap: .9rem .7rem; margin-top: .8rem; }
  .stamp { display: grid; justify-items: center; gap: .35rem; text-align: center; font-size: .76rem; color: var(--soft); }
  .stamp .pic { position: relative; width: 100%; }
  .stamp img { width: 100%; height: auto; display: block; }
  .stamp:not(.got) img { filter: grayscale(1) contrast(.85); opacity: .5; }
  .stamp .lock { position: absolute; inset: 0; margin: auto; width: 34px; height: 34px; border-radius: 50%; background: #fff;
    display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0, 0, 0, .12); }
  .stamp .lock svg { width: 16px; height: 16px; color: var(--soft); }
  .stamp.got { color: var(--ink); }

  .trips { display: grid; gap: .5rem; margin-top: .6rem; }
  .trip { display: flex; gap: .75rem; align-items: center; background: var(--bg); border-radius: 16px; padding: .6rem; }
  .trip img { width: 58px; height: 58px; border-radius: 12px; object-fit: cover; flex: none; }
  .trip p { margin: 0; font-size: .85rem; line-height: 1.6; }
  .trip small { color: var(--soft); font-size: .75rem; }
  .empty { margin: .4rem 0 0; color: var(--soft); font-size: .88rem; }

  .settings { display: grid; gap: .1rem; margin-top: .4rem; }
  .set { display: flex; align-items: center; justify-content: space-between; gap: .8rem; padding: .65rem 0; border-bottom: 1px solid var(--line); }
  .set:last-child { border-bottom: 0; }
  .set select { width: auto; max-width: 11rem; padding: .4rem .6rem; }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: #D6D3CA; transition: background .2s; pointer-events: none; }
  .switch span::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; transition: inset-inline-start .2s; }
  .switch input:checked + span { background: var(--olive); }
  .switch input:checked + span::after { inset-inline-start: 23px; }
  .switch input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
  .danger { color: #A1442F; border-color: #E4C3B9; }
</style>
</head>
<body>
<main class="page">
  <header class="app-top">
    <h1 style="font-size:1.5rem">الحساب</h1>
    <a class="round" href="home.html" aria-label="الرئيسية">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  </header>

  <!-- Signed out: sign in or make an account (a mockup) -->
  <section class="card" id="auth" hidden>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabIn" aria-selected="true">تسجيل الدخول</button>
      <button type="button" role="tab" id="tabUp" aria-selected="false">حساب جديد</button>
    </div>
    <form id="authForm" style="margin-top:1rem" novalidate>
      <label class="f" id="nameRow" hidden>الاسم<input type="text" id="name" autocomplete="name" maxlength="30"></label>
      <label class="f">البريد الإلكتروني<input type="email" id="email" autocomplete="email" dir="ltr" required></label>
      <label class="f">كلمة المرور<input type="password" id="password" autocomplete="current-password" dir="ltr"></label>
      <button class="btn primary block" type="submit" id="authBtn">دخول</button>
      <p class="demo">نسخة تجريبية: ما فيه حساب حقيقي. نحفظ اسمك وبريدك في هذا المتصفح بس، وكلمة المرور ما تنحفظ أبداً.</p>
      <p class="or">أو</p>
      <button class="btn block" type="button" id="guestBtn">كمّل كزائر</button>
    </form>
  </section>

  <!-- Signed in -->
  <section class="card" id="me" hidden>
    <div class="profile">
      <span class="avatar" id="avatar" aria-hidden="true"></span>
      <div><b id="meName"></b><small id="meEmail"></small></div>
    </div>
    <div class="stats" style="margin-top:.9rem">
      <div><b id="statStops">٠</b><span>محطة زرتها</span></div>
      <div><b id="statStamps">٠</b><span>طابع</span></div>
      <div><b id="statTrips">٠</b><span>رحلة محفوظة</span></div>
    </div>
  </section>

  <section class="card">
    <div class="stamps-head">
      <h2><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="5.5" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M8.5 13.5L7 21l5-2.5 5 2.5-1.5-7.5" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/></svg>طوابعي</h2>
      <span class="count-pill" id="stampCount"></span>
    </div>
    <p class="lead" style="font-size:.86rem;margin-top:.2rem">كل جولة تكملها تختم لك طابع جديد.</p>
    <div class="meter" aria-hidden="true"><i id="stampMeter" style="width:0"></i></div>
    <div class="stamps" id="stamps"></div>
  </section>

  <section class="card">
    <h2>رحلاتي</h2>
    <div class="trips" id="trips"></div>
  </section>

  <section class="card">
    <h2>الإعدادات</h2>
    <div class="settings">
      <div class="set"><label for="langPick">لغة سعد</label><select id="langPick"></select></div>
      <div class="set"><span id="replyLabel">سعد يرد بالصوت</span>
        <label class="switch"><input type="checkbox" id="replyVoice" aria-labelledby="replyLabel"><span></span></label></div>
      <div class="set"><span>امسح بياناتي من هذا المتصفح</span><button class="btn danger" type="button" id="wipeBtn" style="padding:.4rem .9rem">امسح</button></div>
    </div>
    <button class="link" type="button" id="outBtn" hidden style="margin-top:.4rem">تسجيل الخروج</button>
  </section>
</main>
<nav class="tabbar" data-current="account"></nav>
<script type="module" src="laqya-nav.js"></script>
<script type="module">
import { LANGUAGES, savedLang, rememberLang } from './languages.js';
import { STAMPS, earned, stampDate } from './stamps.js';

const $ = (id) => document.getElementById(id);
const ar = (n) => Number(n).toLocaleString('ar-SA');
const read = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
let signUp = false;
const params = new URLSearchParams(location.search);
const next = params.get('next') === 'home';   // came from the onboarding's welcome: back home once signed in

// ---------- signing in (a mockup) ----------
function setTab(up) {
  signUp = up;
  $('tabIn').setAttribute('aria-selected', String(!up));
  $('tabUp').setAttribute('aria-selected', String(up));
  $('nameRow').hidden = !up;
  $('authBtn').textContent = up ? 'أنشئ حسابي' : 'دخول';
  $('password').autocomplete = up ? 'new-password' : 'current-password';
}
$('tabIn').addEventListener('click', () => setTab(false));
$('tabUp').addEventListener('click', () => setTab(true));
$('authForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const email = $('email').value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) { $('email').focus(); $('email').setCustomValidity('اكتب بريد صحيح'); $('email').reportValidity(); return; }
  const name = (signUp && $('name').value.trim()) || email.split('@')[0];
  $('password').value = '';   // never kept
  write('laqya-user', { name, email });
  if (next) return location.replace('home.html');
  draw();
});
$('email').addEventListener('input', () => $('email').setCustomValidity(''));
$('guestBtn').addEventListener('click', () => { write('laqya-user', { name: 'زائر', guest: true }); if (next) return location.replace('home.html'); draw(); });
$('outBtn').addEventListener('click', () => { try { localStorage.removeItem('laqya-user'); } catch {} draw(); });
$('wipeBtn').addEventListener('click', () => {
  if (!confirm('نمسح حسابك وطوابعك ورحلاتك المحفوظة من هذا المتصفح؟')) return;
  try { ['laqya-user', 'laqya-stop', 'laqya-asked', 'laqya-memories', 'laqya-stamps'].forEach((k) => localStorage.removeItem(k)); } catch {}
  draw();
});

// ---------- settings: the same ones the tour reads ----------
$('langPick').replaceChildren(...LANGUAGES.map((l) => new Option(l.name, l.code)));
$('langPick').value = savedLang() || 'ar';
$('langPick').addEventListener('change', () => { rememberLang($('langPick').value); draw(); });
try { $('replyVoice').checked = localStorage.getItem('expo-reply') !== 'text'; } catch {}
$('replyVoice').addEventListener('change', () => { try { localStorage.setItem('expo-reply', $('replyVoice').checked ? 'voice' : 'text'); } catch {} });

// ---------- the passport, the trips, the profile ----------
function draw() {
  const user = read('laqya-user', null);
  const stop = read('laqya-stop', null);
  const trips = read('laqya-memories', []);
  const reached = stop ? Math.max(stop.max || 0, stop.n || 0) : 0;

  // the passport: a pavilion is stamped when its tour is finished (tour.js)
  const mine = earned();
  const LOCK = '<svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M8.5 10.5V8a3.5 3.5 0 017 0v2.5" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>';
  $('stamps').replaceChildren(...STAMPS.map((s) => {
    const d = document.createElement('div');
    const at = mine[s.id];
    d.className = 'stamp' + (at ? ' got' : '');
    d.innerHTML = `<span class="pic"><img src="${s.img}" alt="طابع ${s.name}">${at ? '' : `<span class="lock" aria-hidden="true">${LOCK}</span>`}</span>`
      + `<span>${at ? stampDate(at) : 'لم تختم بعد'}</span>`;
    return d;
  }));
  const got = STAMPS.filter((s) => mine[s.id]).length;
  $('stampCount').textContent = `${ar(got)} / ${ar(STAMPS.length)}`;
  $('stampMeter').style.width = `${(got / STAMPS.length) * 100}%`;

  $('trips').replaceChildren(...(trips.length ? trips.map((t) => {
    const d = document.createElement('div');
    d.className = 'trip';
    const when = new Date(t.at).toLocaleDateString('ar-SA', { day: 'numeric', month: 'long' });
    const voice = { mine: 'بصوتك', saad: 'بصوت سعد', none: 'بدون صوت' }[t.voice] || '';
    d.innerHTML = '<img src="img/arches.jpg" alt=""><div><p></p><small></small></div>';
    d.querySelector('p').textContent = t.story || 'رحلة بدون قصة';
    d.querySelector('small').textContent = `${when} · ${voice} · ${ar(t.seconds || 0)} ثانية`;
    return d;
  }) : [Object.assign(document.createElement('p'), { className: 'empty', innerHTML: 'ما حفظت رحلة للحين. <a href="memory.html">اصنع ذكرياتك</a>' })]));

  $('auth').hidden = !!user;
  $('me').hidden = !user;
  $('outBtn').hidden = !user;
  if (user) {
    $('avatar').textContent = (user.name || '؟')[0];
    $('meName').textContent = user.name;
    $('meEmail').textContent = user.guest ? 'زائر' : user.email;
    $('statStops').textContent = ar(reached);
    $('statStamps').textContent = ar(got);
    $('statTrips').textContent = ar(trips.length);
  }
}
if (params.get('signup')) setTab(true);
draw();
</script>
</body>
</html>
