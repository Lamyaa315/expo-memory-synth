<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لقيا · الجولة</title>
<style>
  /* Wide screens: the 3D tour (tour.html) shows inside a phone-wide column, like the rest of the app (laqya.css).
     Inside the frame the page is phone-wide, so its own phone layout applies as is. */
  html, body { margin: 0; height: 100%; background: #E7E5DF; overflow: hidden; }
  iframe { display: block; width: 460px; max-width: 100%; height: 100%; margin: 0 auto; border: 0; background: #110E0C;
    box-shadow: 0 0 60px rgba(31, 31, 26, .10); }
</style>
</head>
<body>
<iframe id="app" title="الجولة" allow="microphone; autoplay; fullscreen; clipboard-write"></iframe>
<script>
  // frame.html#tour.html?stop=2 → shows that page; the hash keeps it across a refresh
  const page = decodeURIComponent(location.hash.slice(1)) || 'tour.html';
  const app = document.getElementById('app');
  app.src = /^[\w-]+\.html(\?[^#]*)?$/.test(page) ? page : 'tour.html';
  app.addEventListener('load', () => {
    try {
      const inner = app.contentWindow.location;
      // left the tour (home, the map…): those pages draw their own phone column, so open them directly
      if (!inner.pathname.endsWith('/tour.html')) return location.replace(inner.href);
      history.replaceState(null, '', '#' + inner.pathname.split('/').pop() + inner.search);
      document.title = app.contentDocument.title;
    } catch { /* not the same site: leave it */ }
  });
</script>
</body>
</html>
